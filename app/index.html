<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Postgres demo</title>
<style>body{font:15px system-ui;max-width:760px;margin:1rem auto;padding:0 1rem}input,button{padding:.4rem;margin:.15rem 0}input{width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:.3rem;text-align:left}#m{min-height:1.4em;font-weight:600}.e{color:#c00}.g{color:#080}</style>
<h2>Postgres demo <small id=s></small></h2>
<div id=m></div>
<details><summary>Databases</summary><ul id=d></ul></details>
<h3>Create table</h3>
<div id=p></div>
<input id=n placeholder="table name, e.g. employees">
<input id=c placeholder="columns, e.g. name:text, age:integer, joined:date">
<small>types: text integer numeric boolean date timestamp</small><br>
<button onclick=mk()>Create table</button>
<h3>Tables</h3><div id=t></div>
<div id=v hidden><h3 id=h></h3><div id=f></div><button onclick=add()>Add row</button><table id=r></table></div>
<script>
const $=i=>document.getElementById(i),P={Employees:'employees|name:text,email:text,age:integer',Products:'products|name:text,price:numeric,in_stock:boolean',Notes:'notes|title:text,body:text'};let cur;
const x=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const say=(t,e)=>{$('m').textContent=t;$('m').className=e?'e':'g'};
async function api(p,m,b){const r=await fetch(p,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||r.statusText);return d}
const run=f=>f().catch(e=>say(e.message,1));
async function st(){try{const d=await api('/api/status');$('s').textContent=d.connected?'- DB connected ('+d.host+')':'- DB NOT connected, retrying...';if(d.connected&&!$('t').innerHTML)ld()}catch(e){$('s').textContent='- app error'}}
function ld(){run(async()=>{const d=await api('/api/dbinfo');$('d').innerHTML=d.databases.map(n=>'<li>'+x(n)+(n==d.current?' (connected)':'')).join('');$('t').innerHTML=d.tables.length?d.tables.map(t=>`<div><b>${x(t.name)}</b> (${t.rows} rows: ${x(t.columns.map(c=>c.name).join(', '))}) <button onclick="op('${x(t.name)}')">Open</button> <button onclick="dr('${x(t.name)}')">Drop</button></div>`).join(''):'No tables yet'})}
function mk(){run(async()=>{const columns=$('c').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const[n,t]=s.split(':');return{name:n.trim(),type:(t||'text').trim()}});const name=$('n').value.trim();say((await api('/api/tables','POST',{name,columns})).message);$('n').value=$('c').value='';ld();op(name.toLowerCase())})}
function op(n){run(async()=>{const d=await api('/api/tables/'+n+'/rows');cur=d.table;$('h').textContent='Table: '+cur;$('f').innerHTML=d.columns.filter(c=>c.name!='id').map(c=>`<input data-c="${x(c.name)}" type="${{integer:'number',numeric:'number',date:'date'}[c.type]||'text'}" placeholder="${x(c.name)} (${x(c.type.split(' ')[0])})">`).join('');$('r').innerHTML='<tr>'+d.columns.map(c=>'<th>'+x(c.name)).join('')+'<th></tr>'+d.rows.map(r=>'<tr>'+d.columns.map(c=>'<td>'+x(r[c.name])).join('')+`<td><button onclick="rm(${r.id})">Delete</button>`).join('');$('v').hidden=false})}
function add(){run(async()=>{const values={};document.querySelectorAll('#f input').forEach(i=>values[i.dataset.c]=i.value);say((await api('/api/tables/'+cur+'/rows','POST',{values})).message);op(cur);ld()})}
function rm(id){run(async()=>{say((await api('/api/tables/'+cur+'/rows/'+id,'DELETE')).message);op(cur);ld()})}
function dr(n){if(confirm('Drop '+n+'?'))run(async()=>{say((await api('/api/tables/'+n,'DELETE')).message);if(cur==n)$('v').hidden=true;ld()})}
$('p').innerHTML='Quick start: '+Object.keys(P).map(k=>`<button onclick="tp('${k}')">${k}</button>`).join(' ');
function tp(k){const[n,c]=P[k].split('|');$('n').value=n;$('c').value=c}
st();setInterval(st,8000)
</script>
