---
# Install PostgreSQL packages and Python driver
- name: Install PostgreSQL packages
  dnf:
    name:
      - postgresql15-server
      - postgresql15
      - python3-psycopg2
    state: present

# Initialize PostgreSQL only once
- name: Check PostgreSQL initialization
  stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: postgres_data

- name: Initialize PostgreSQL
  command: /usr/bin/postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION
  when: not postgres_data.stat.exists

# Configure PostgreSQL network access
- name: Configure PostgreSQL listening address
  lineinfile:
    path: /var/lib/pgsql/data/postgresql.conf
    regexp: '^#?\s*listen_addresses\s*='
    line: "listen_addresses = '*'"
  notify: Restart PostgreSQL

# Configure password authentication
- name: Configure PostgreSQL client authentication
  blockinfile:
    path: /var/lib/pgsql/data/pg_hba.conf
    marker: "# {mark} ANSIBLE MANAGED"
    block: |
      host {{ db_name }} {{ db_user }} {{ db_allowed_cidr }} scram-sha-256
  notify: Restart PostgreSQL

# Start PostgreSQL
- name: Start PostgreSQL service
  systemd:
    name: postgresql
    state: started
    enabled: true

# Apply configuration changes
- name: Apply PostgreSQL configuration
  meta: flush_handlers

# Create PostgreSQL user
- name: Create PostgreSQL application user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: LOGIN
    state: present
    login_user: postgres
    login_unix_socket: /var/run/postgresql
  become_user: postgres
  no_log: true

# Create PostgreSQL database
- name: Create PostgreSQL database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    state: present
    login_user: postgres
    login_unix_socket: /var/run/postgresql
  become_user: postgres

# Check PostgreSQL service
- name: Check PostgreSQL service
  command: systemctl is-active postgresql
  register: postgres_status
  changed_when: false

- name: Display PostgreSQL status
  debug:
    msg: "PostgreSQL is {{ postgres_status.stdout }}"